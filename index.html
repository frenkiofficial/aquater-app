<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AQUATER Driver Express</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12">
  
  <!-- Header Mobile -->
  <div class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur border-b border-slate-800 p-4">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-lg font-bold text-cyan-400">AQUATER Driver</h1>
        <p class="text-xs text-slate-400" id="driverIdentityText">Pengantar Lepas</p>
      </div>
      <button onclick="changeName()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700">
        Ganti Nama
      </button>
    </div>
  </div>

  <main class="max-w-md mx-auto p-4 space-y-6">
    
    <!-- Tab Active Job -->
    <section>
      <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Job Sedang Diambil</h2>
      <div id="activeJobContainer">
        <!-- Will be populated via JS -->
      </div>
    </section>

    <!-- Tab Available Jobs -->
    <section>
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Job Tersedia</h2>
        <span id="availableBadge" class="text-xs bg-cyan-500/10 text-cyan-400 px-2 py-0.5 rounded-full font-bold">0 Job</span>
      </div>
      <div id="availableJobsList" class="space-y-3">
        <!-- Will be populated via JS -->
      </div>
    </section>

  </main>

  <script type="module">
    import { db, ref, update, onValue } from './firebase-config.js';

    // Manajemen Identitas Driver Simpel
    let currentDriverName = localStorage.getItem('aquater_driver_name');
    if (!currentDriverName) {
      currentDriverName = prompt("Masukkan nama Anda (bebas):") || "Driver-" + Math.floor(Math.random()*100);
      localStorage.setItem('aquater_driver_name', currentDriverName);
    }
    document.getElementById('driverIdentityText').innerText = `Halo, ${currentDriverName}`;

    window.changeName = () => {
      const newName = prompt("Masukkan nama baru Anda:", currentDriverName);
      if (newName) {
        localStorage.setItem('aquater_driver_name', newName);
        location.reload();
      }
    };

    // Realtime Listener untuk Driver
    onValue(ref(db, 'orders'), (snapshot) => {
      const data = snapshot.val();
      const availableContainer = document.getElementById('availableJobsList');
      const activeContainer = document.getElementById('activeJobContainer');
      
      availableContainer.innerHTML = '';
      activeContainer.innerHTML = '';

      if (!data) {
        availableContainer.innerHTML = '<p class="text-sm text-slate-500 text-center py-6">Belum ada job antar saat ini.</p>';
        activeContainer.innerHTML = '<p class="text-xs text-slate-600 italic">Anda tidak memiliki job aktif.</p>';
        return;
      }

      let availableCount = 0;
      let hasActiveJob = false;

      Object.keys(data).reverse().forEach(id => {
        const order = data[id];

        // 1. Render Active Job milik Driver Ini
        if (order.takenBy === currentDriverName && order.status !== 'COMPLETED') {
          hasActiveJob = true;
          let actionButton = '';

          if (order.status === 'TAKEN') {
            actionButton = `
              <button onclick="updateStatus('${id}', 'AT_DEPOT')" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 rounded-xl transition">
                1. Sudah Jemput Galon & Terima Cash (Rp ${order.totalCash.toLocaleString()})
              </button>`;
          } else if (order.status === 'AT_DEPOT') {
            actionButton = `
              <button onclick="updateStatus('${id}', 'COMPLETED')" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-xl transition">
                2. Galon Selesai Diisi & Diantar ke Rumah Pelanggan
              </button>`;
          }

          activeContainer.innerHTML = `
            <div class="bg-slate-900 border-2 border-cyan-500/50 p-4 rounded-2xl shadow-lg space-y-4">
              <div class="flex justify-between items-start">
                <div>
                  <h3 class="font-bold text-lg text-slate-100">${order.customerName}</h3>
                  <p class="text-xs text-slate-300 mt-1">${order.address}</p>
                </div>
                <span class="bg-cyan-500/20 text-cyan-300 text-xs px-2 py-1 rounded-lg font-bold">${order.qty} Galon</span>
              </div>
              <div class="bg-slate-950 p-3 rounded-xl space-y-1 text-xs font-mono border border-slate-800">
                <div class="flex justify-between text-amber-400">
                  <span>Terima Cash Pelanggan:</span>
                  <span>Rp ${order.totalCash.toLocaleString()}</span>
                </div>
                <div class="flex justify-between text-slate-400">
                  <span>Setor ke Depot:</span>
                  <span>Rp ${order.depotCut.toLocaleString()}</span>
                </div>
                <div class="flex justify-between text-emerald-400 font-bold pt-1 border-t border-slate-800">
                  <span>Komisi Anda:</span>
                  <span>Rp ${order.driverFee.toLocaleString()}</span>
                </div>
              </div>
              ${actionButton}
            </div>
          `;
        }

        // 2. Render Available Jobs (yang belum diambil orang)
        if (order.status === 'AVAILABLE') {
          availableCount++;
          availableContainer.innerHTML += `
            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
              <div class="flex justify-between items-start">
                <div>
                  <h3 class="font-bold text-slate-100">${order.customerName}</h3>
                  <p class="text-xs text-slate-400 mt-0.5">${order.address}</p>
                </div>
                <span class="text-xs font-bold text-emerald-400 bg-emerald-500/10 px-2 py-1 rounded-lg">
                  +Rp ${order.driverFee.toLocaleString()}
                </span>
              </div>
              <div class="flex justify-between items-center pt-2 border-t border-slate-800/60">
                <span class="text-xs text-slate-500 font-mono">${order.qty} Galon</span>
                <button onclick="takeJob('${id}')" 
                  class="bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 text-xs font-bold px-4 py-2 rounded-xl transition">
                  Ambil Job
                </button>
              </div>
            </div>
          `;
        }
      });

      document.getElementById('availableBadge').innerText = `${availableCount} Job`;
      if (!hasActiveJob && activeContainer.innerHTML === '') {
        activeContainer.innerHTML = '<p class="text-xs text-slate-600 italic">Anda tidak memiliki job aktif.</p>';
      }
      if (availableCount === 0) {
        availableContainer.innerHTML = '<p class="text-sm text-slate-500 text-center py-6">Belum ada job antar saat ini.</p>';
      }
    });

    // Action Take Job
    window.takeJob = (id) => {
      update(ref(db, `orders/${id}`), {
        status: 'TAKEN',
        takenBy: currentDriverName
      });
    };

    // Action Update Status
    window.updateStatus = (id, newStatus) => {
      update(ref(db, `orders/${id}`), {
        status: newStatus
      });
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AQUATER Driver Express</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background-color: #f0f4f8;
    }
    .clay-card {
      background: #ffffff;
      border-radius: 26px;
      box-shadow: 10px 10px 20px #d1d9e6, -10px -10px 20px #ffffff, inset 2px 2px 5px rgba(255,255,255,0.8);
    }
    .clay-card-active {
      background: #ffffff;
      border-radius: 26px;
      box-shadow: 10px 10px 20px #c2d4f8, -10px -10px 20px #ffffff;
      border: 2px solid #60a5fa;
    }
    .clay-btn-take {
      background: linear-gradient(145deg, #10b981, #059669);
      border-radius: 16px;
      box-shadow: 4px 4px 10px #a7f3d0, -4px -4px 10px #ffffff;
      color: white;
    }
    .clay-btn-take:active {
      box-shadow: inset 3px 3px 6px #047857;
    }
    .clay-btn-step {
      background: linear-gradient(145deg, #3b82f6, #1d4ed8);
      border-radius: 18px;
      box-shadow: 5px 5px 12px #93c5fd, -5px -5px 12px #ffffff;
      color: white;
    }
    .clay-btn-step:active {
      box-shadow: inset 3px 3px 6px #1e40af;
    }
    .clay-badge {
      border-radius: 12px;
      box-shadow: inset 2px 2px 4px rgba(0,0,0,0.05);
    }
  </style>
</head>
<body class="text-slate-700 min-h-screen pb-12">

  <!-- Header Mobile -->
  <div class="sticky top-0 z-50 bg/#f0f4f8/80 backdrop-blur p-4">
    <div class="max-w-md mx-auto clay-card p-4 flex justify-between items-center">
      <div>
        <h1 class="text-lg font-extrabold text-blue-600">AQUATER Driver</h1>
        <p class="text-xs text-slate-500 font-bold" id="driverIdentityText">Pengantar Lepas</p>
      </div>
      <button onclick="changeName()" class="clay-badge bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 text-xs font-bold">
        ✏️ Ganti
      </button>
    </div>
  </div>

  <main class="max-w-md mx-auto p-4 space-y-5">
    
    <!-- Widget Dompet Komisi Hari Ini -->
    <section class="clay-card p-4 flex justify-between items-center bg-gradient-to-r from-blue-500 to-indigo-600 text-white">
      <div>
        <p class="text-xs text-blue-100 font-bold">Total Komisi Hari Ini</p>
        <h3 class="text-xl font-extrabold" id="totalEarnings">Rp 0</h3>
      </div>
      <span class="text-2xl">💰</span>
    </section>

    <!-- Job Sedang Diambil -->
    <section>
      <h2 class="text-xs font-extrabold uppercase tracking-wider text-slate-400 mb-2 ml-1">Job Sedang Diambil</h2>
      <div id="activeJobContainer">
        <!-- JS Populated -->
      </div>
    </section>

    <!-- Job Tersedia -->
    <section>
      <div class="flex justify-between items-center mb-2 ml-1">
        <h2 class="text-xs font-extrabold uppercase tracking-wider text-slate-400">Job Tersedia</h2>
        <span id="availableBadge" class="clay-badge bg-blue-100 text-blue-600 px-2.5 py-0.5 text-xs font-extrabold">0 Job</span>
      </div>
      <div id="availableJobsList" class="space-y-3">
        <!-- JS Populated -->
      </div>
    </section>

  </main>

  <script type="module">
    import { db, ref, update, onValue } from './firebase-config.js';

    let currentDriverName = localStorage.getItem('aquater_driver_name');
    if (!currentDriverName) {
      currentDriverName = prompt("Masukkan nama Anda (bebas):") || "Driver-" + Math.floor(Math.random()*100);
      localStorage.setItem('aquater_driver_name', currentDriverName);
    }
    document.getElementById('driverIdentityText').innerText = `Halo, ${currentDriverName}`;

    window.changeName = () => {
      const newName = prompt("Masukkan nama baru Anda:", currentDriverName);
      if (newName) {
        localStorage.setItem('aquater_driver_name', newName);
        location.reload();
      }
    };

    window.openMaps = (address) => {
      window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}`, '_blank');
    };

    onValue(ref(db, 'orders'), (snapshot) => {
      const data = snapshot.val();
      const availableContainer = document.getElementById('availableJobsList');
      const activeContainer = document.getElementById('activeJobContainer');
      const earningsText = document.getElementById('totalEarnings');
      
      availableContainer.innerHTML = '';
      activeContainer.innerHTML = '';

      if (!data) {
        availableContainer.innerHTML = '<p class="text-sm text-slate-400 text-center py-6">Belum ada job antar saat ini.</p>';
        activeContainer.innerHTML = '<p class="text-xs text-slate-400 italic ml-1">Tidak ada job aktif.</p>';
        earningsText.innerText = 'Rp 0';
        return;
      }

      let availableCount = 0;
      let hasActiveJob = false;
      let totalEarnedToday = 0;

      Object.keys(data).reverse().forEach(id => {
        const order = data[id];

        // Hitung komisi driver hari ini
        if (order.takenBy === currentDriverName && order.status === 'COMPLETED') {
          totalEarnedToday += order.driverFee;
        }

        // Active Job milik Driver Ini
        if (order.takenBy === currentDriverName && order.status !== 'COMPLETED') {
          hasActiveJob = true;
          let actionButton = '';

          if (order.status === 'TAKEN') {
            actionButton = `
              <button onclick="updateStatus('${id}', 'AT_DEPOT')" class="w-full clay-btn-step py-3.5 font-extrabold text-xs tracking-wide">
                1. Sudah Jemput & Terima Cash (Rp ${order.totalCash.toLocaleString()})
              </button>`;
          } else if (order.status === 'AT_DEPOT') {
            actionButton = `
              <button onclick="updateStatus('${id}', 'COMPLETED')" class="w-full clay-btn-take py-3.5 font-extrabold text-xs tracking-wide">
                2. Selesai Diisi & Diantar ke Rumah Pelanggan
              </button>`;
          }

          activeContainer.innerHTML = `
            <div class="clay-card-active p-4 space-y-3">
              <div class="flex justify-between items-start">
                <div>
                  <h3 class="font-extrabold text-slate-800 text-base">${order.customerName}</h3>
                  <p class="text-xs text-slate-500 font-medium mt-0.5">${order.address}</p>
                </div>
                <span class="clay-badge bg-blue-100 text-blue-700 text-xs px-2.5 py-1 font-extrabold">${order.qty} Galon</span>
              </div>

              <button onclick="openMaps('${order.address}')" class="text-xs font-bold text-blue-600 bg-blue-50 px-3 py-1 rounded-lg">
                📍 Buka Google Maps
              </button>

              <div class="bg-slate-50 p-3 rounded-2xl space-y-1 text-xs font-semibold border border-slate-100">
                <div class="flex justify-between text-amber-600">
                  <span>Tagih Pelanggan:</span>
                  <span class="font-extrabold">Rp ${order.totalCash.toLocaleString()}</span>
                </div>
                <div class="flex justify-between text-slate-500">
                  <span>Setor ke Depot:</span>
                  <span>Rp ${order.depotCut.toLocaleString()}</span>
                </div>
                <div class="flex justify-between text-emerald-600 font-extrabold pt-1 border-t border-slate-200">
                  <span>Komisi Bersih Anda:</span>
                  <span>Rp ${order.driverFee.toLocaleString()}</span>
                </div>
              </div>

              ${actionButton}
            </div>
          `;
        }

        // Available Jobs
        if (order.status === 'AVAILABLE') {
          availableCount++;
          availableContainer.innerHTML += `
            <div class="clay-card p-4 space-y-3">
              <div class="flex justify-between items-start">
                <div>
                  <h3 class="font-extrabold text-slate-800">${order.customerName}</h3>
                  <p class="text-xs text-slate-500 font-medium">${order.address}</p>
                </div>
                <span class="clay-badge bg-emerald-100 text-emerald-700 text-xs px-2.5 py-1 font-extrabold">
                  +Rp ${order.driverFee.toLocaleString()}
                </span>
              </div>
              <div class="flex justify-between items-center pt-2 border-t border-slate-100">
                <span class="text-xs text-slate-400 font-bold">${order.qty} Galon</span>
                <button onclick="takeJob('${id}')" class="clay-btn-take px-5 py-2 text-xs font-extrabold">
                  Ambil Job
                </button>
              </div>
            </div>
          `;
        }
      });

      earningsText.innerText = `Rp ${totalEarnedToday.toLocaleString()}`;
      document.getElementById('availableBadge').innerText = `${availableCount} Job`;

      if (!hasActiveJob && activeContainer.innerHTML === '') {
        activeContainer.innerHTML = '<p class="text-xs text-slate-400 italic ml-1">Tidak ada job aktif.</p>';
      }
      if (availableCount === 0) {
        availableContainer.innerHTML = '<p class="text-sm text-slate-400 text-center py-6">Belum ada job antar saat ini.</p>';
      }
    });

    window.takeJob = (id) => {
      update(ref(db, `orders/${id}`), {
        status: 'TAKEN',
        takenBy: currentDriverName
      });
    };

    window.updateStatus = (id, newStatus) => {
      update(ref(db, `orders/${id}`), {
        status: newStatus
      });
    };
  </script>
</body>
</html>

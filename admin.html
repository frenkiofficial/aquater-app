<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AQUATER - Admin Dispatcher</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="flex justify-between items-center bg-slate-800/80 backdrop-blur p-5 rounded-2xl border border-slate-700/50 shadow-xl">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-cyan-400">AQUATER Dispatcher</h1>
        <p class="text-xs text-slate-400 mt-1">Panel Input Pesanan & Monitoring Kurir</p>
      </div>
      <div class="text-right">
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Firebase Connected
        </span>
      </div>
    </header>

    <!-- Grid Container -->
    <div class="grid md:grid-cols-5 gap-6">
      
      <!-- Form Input Pesanan (2 Kolom) -->
      <div class="md:col-span-2 bg-slate-800/50 p-6 rounded-2xl border border-slate-700/50 h-fit">
        <h2 class="text-lg font-semibold text-slate-200 mb-4 flex items-center gap-2">
          <span>+</span> Input Pesanan Baru
        </h2>
        <form id="orderForm" class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Nama Pelanggan</label>
            <input type="text" id="custName" required placeholder="Contoh: Pak Budi"
              class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-cyan-500 transition">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Alamat / Patokan</label>
            <textarea id="custAddress" required rows="2" placeholder="Contoh: Depan Masjid Nurul Haq"
              class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-cyan-500 transition"></textarea>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Jumlah Galon</label>
            <input type="number" id="qty" min="1" value="1" required
              class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-cyan-500 transition">
          </div>
          <button type="submit"
            class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 rounded-xl shadow-lg shadow-cyan-500/20 transition duration-200 active:scale-98">
            Terbitkan Job Antar
          </button>
        </form>
      </div>

      <!-- Live Monitoring (3 Kolom) -->
      <div class="md:col-span-3 bg-slate-800/50 p-6 rounded-2xl border border-slate-700/50">
        <h2 class="text-lg font-semibold text-slate-200 mb-4">Daftar Status Pesanan</h2>
        <div id="adminJobList" class="space-y-3 max-h-[500px] overflow-y-auto pr-1">
          <p class="text-sm text-slate-500 italic">Belum ada pesanan aktif...</p>
        </div>
      </div>

    </div>
  </div>

  <script type="module">
    import { db, ref, push, set, onValue } from './firebase-config.js';

    // Submit Order Baru
    document.getElementById('orderForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('custName').value;
      const address = document.getElementById('custAddress').value;
      const qty = parseInt(document.getElementById('qty').value);
      
      const newOrderRef = push(ref(db, 'orders'));
      set(newOrderRef, {
        customerName: name,
        address: address,
        qty: qty,
        status: 'AVAILABLE', // AVAILABLE -> TAKEN -> AT_DEPOT -> COMPLETED
        takenBy: null,
        totalCash: qty * 7000,
        depotCut: qty * 5000,
        driverFee: qty * 2000,
        createdAt: Date.now()
      });

      document.getElementById('orderForm').reset();
    });

    // Realtime Listener untuk Dashboard Admin
    onValue(ref(db, 'orders'), (snapshot) => {
      const container = document.getElementById('adminJobList');
      container.innerHTML = '';
      const data = snapshot.val();

      if (!data) {
        container.innerHTML = '<p class="text-sm text-slate-500 italic">Belum ada pesanan masuk...</p>';
        return;
      }

      Object.keys(data).reverse().forEach(id => {
        const order = data[id];
        let statusBadge = '';

        if (order.status === 'AVAILABLE') {
          statusBadge = `<span class="px-2.5 py-1 text-xs rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20">Menunggu Kurir</span>`;
        } else if (order.status === 'TAKEN') {
          statusBadge = `<span class="px-2.5 py-1 text-xs rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20">Jemput Galon (${order.takenBy})</span>`;
        } else if (order.status === 'AT_DEPOT') {
          statusBadge = `<span class="px-2.5 py-1 text-xs rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">Diisi di Depot</span>`;
        } else {
          statusBadge = `<span class="px-2.5 py-1 text-xs rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Selesai</span>`;
        }

        const card = `
          <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-700/60 flex justify-between items-start">
            <div class="space-y-1">
              <div class="flex items-center gap-2">
                <span class="font-bold text-slate-100">${order.customerName}</span>
                <span class="text-xs text-slate-400">(${order.qty} Galon)</span>
              </div>
              <p class="text-xs text-slate-400 leading-relaxed">${order.address}</p>
              <p class="text-xs text-slate-500 font-mono">Tagih Cash: Rp ${order.totalCash.toLocaleString()}</p>
            </div>
            <div>${statusBadge}</div>
          </div>
        `;
        container.innerHTML += card;
      });
    });
  </script>
</body>
</html>
